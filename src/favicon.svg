<!-- The app's own crop mark, at the size a tab shows it: a saffron mark on an
     ink tile, the same two colours as the primary button and the frame (see
     docs/design/voice.md). Same two strokes as the `crop` glyph in
     src/icons.ts. scripts/raster-icon.mjs draws the PNG versions in the same
     colours. Vendored rather than fetched.

     The 24-unit glyph is scaled to 20 and centred on a 32-unit tile, and the
     stroke is thickened from 2 to 2.8: at 16px a hairline disappears into the
     background, which is the one size a favicon has to survive. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#161614"/>
  <g transform="translate(6 6) scale(0.8333)"
     fill="none" stroke="#ffc21f" stroke-width="2.8"
     stroke-linecap="square" stroke-linejoin="miter">
    <path d="M6 2v16h16"/>
    <path d="M18 22V6H2"/>
  </g>
</svg>
